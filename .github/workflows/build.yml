name: Build MediaTok iOS (Ghost Edition)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 340

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          echo "Target Xcode from versions.json: $XCODE_VERSION"
          ls -d /Applications/Xcode*.app || true
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          else
            FALLBACK_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
            sudo xcode-select -s "${FALLBACK_XCODE}/Contents/Developer"
          fi
          xcodebuild -version
          df -h

      - name: Compute Bazel cache key
        run: |
          KEY_HASH=$(shasum -a 256 versions.json MODULE.bazel.lock 2>/dev/null | shasum -a 256 | awk '{print $1}' | cut -c1-16)
          echo "BAZEL_CACHE_PREFIX=ios-bazel-disk-v1-${KEY_HASH}-" >> "$GITHUB_ENV"
          echo "BAZEL_CACHE_KEY=ios-bazel-disk-v1-${KEY_HASH}-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Restore Bazel Disk Cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/bazel-disk-cache
          key: ${{ env.BAZEL_CACHE_KEY }}
          restore-keys: |
            ${{ env.BAZEL_CACHE_PREFIX }}
            ios-bazel-disk-v1-

      - name: Move source to canonical directory
        run: |
          set -euxo pipefail
          sudo mkdir -p /Users/Shared
          rm -rf /Users/Shared/telegram-ios
          mv "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios
          mkdir -p "$GITHUB_WORKSPACE"
          df -h

      - name: Run MediaTok Security & Core Logic Tests (macOS Swift 6.3)
        run: |
          set -euxo pipefail
          cd /Users/Shared/telegram-ios
          swiftc -parse-as-library -warnings-as-errors -O \
            Ghostgram/Features/Appearance/Sources/MediaTok/GGMediaTokCoreLogic.swift \
            Ghostgram/Features/Appearance/Tests/GGMediaTokSecurityTestsMain.swift \
            -o /tmp/mediatok_security_tests
          /tmp/mediatok_security_tests
          rm -f /tmp/mediatok_security_tests

      - name: Build MediaTok Ghost IPA
        run: |
          set -euxo pipefail
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          APP_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')
          COMMIT_COUNT=$(git rev-list --count HEAD)
          BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          # Verify generated strings are up to date
          python3 Ghostgram/Strings/check.py --strict

          # Pin Bazel to the active Xcode on macOS 27 runners
          bash build-system/GGXcodeConfig.sh

          # Apply Ghostgram submodule patches idempotently
          if git -C build-system/bazel-rules/rules_apple apply --check "$SOURCE_DIR/build-system/GGPatches/rules_apple-strip-shell-env.patch" 2>/dev/null; then
            git -C build-system/bazel-rules/rules_apple apply "$SOURCE_DIR/build-system/GGPatches/rules_apple-strip-shell-env.patch"
          else
            git -C build-system/bazel-rules/rules_apple apply --reverse --check "$SOURCE_DIR/build-system/GGPatches/rules_apple-strip-shell-env.patch"
          fi

          if git -C submodules/TgVoipWebrtc/tgcalls apply --check "$SOURCE_DIR/build-system/GGPatches/tgcalls-call-camera-masks.patch" 2>/dev/null; then
            git -C submodules/TgVoipWebrtc/tgcalls apply "$SOURCE_DIR/build-system/GGPatches/tgcalls-call-camera-masks.patch"
          else
            git -C submodules/TgVoipWebrtc/tgcalls apply --reverse --check "$SOURCE_DIR/build-system/GGPatches/tgcalls-call-camera-masks.patch"
          fi

          # Import fake codesigning cert and renew expired provisioning profiles
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          SIGN_ID=$(security find-identity -p codesigning temp.keychain | grep -o '"[^"]*"' | head -n 1 | tr -d '"')
          echo "Using fake-codesigning identity: $SIGN_ID"
          for mp in build-system/fake-codesigning/profiles/*.mobileprovision; do
            TMP_PLIST="$(mktemp).plist"
            security cms -D -i "$mp" > "$TMP_PLIST"
            python3 -c 'import datetime, plistlib, sys; p = sys.argv[1]; d = plistlib.load(open(p, "rb")); d["ExpirationDate"] = datetime.datetime(2030, 10, 20, 0, 0, 0); d.pop("DER-Encoded-Profile", None); plistlib.dump(d, open(p, "wb"))' "$TMP_PLIST"
            security cms -S -k temp.keychain -N "$SIGN_ID" -i "$TMP_PLIST" -o "$mp"
            rm -f "$TMP_PLIST"
          done

          mkdir -p "$HOME/.cache/bazel-disk-cache"
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$HOME/.cache/bazel-disk-cache" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath="$SOURCE_DIR/build/artifacts"

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$SOURCE_DIR/build/artifacts/Telegram.ipa" "$GITHUB_WORKSPACE/dist/MediaTok.ipa"
          [ -f "$SOURCE_DIR/build/artifacts/Telegram.DSYMs.zip" ] && cp "$SOURCE_DIR/build/artifacts/Telegram.DSYMs.zip" "$GITHUB_WORKSPACE/dist/MediaTok.DSYMs.zip" || true
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MediaTok-iOS-Ghost-${{ env.APP_VERSION }}-b${{ env.BUILD_NUMBER }}
          path: dist/
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ios-ghost-v${APP_VERSION}-b${BUILD_NUMBER}"
          python3 - <<'PY' "$TAG" "$APP_VERSION" "$BUILD_NUMBER" "$GITHUB_WORKSPACE/dist/MediaTok.ipa" "$GITHUB_WORKSPACE/dist/apps.json"
          import datetime, json, os, sys
          tag, app_ver, build_num, ipa_path, out_path = sys.argv[1:6]
          size = os.path.getsize(ipa_path) if os.path.isfile(ipa_path) else 0
          now_iso = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          dl_url = f"https://github.com/ownersavesociety/MediaTok-iOS/releases/download/{tag}/MediaTok.ipa"
          source = {
              "name": "MediaTok iOS Ghost Edition",
              "subtitle": "Official Auto-Update Source for AltStore / SideStore / ESign / Feather",
              "identifier": "org.mediatok.ios.source",
              "sourceURL": "https://github.com/ownersavesociety/MediaTok-iOS/releases/latest/download/apps.json",
              "apps": [
                  {
                      "name": "MediaTok",
                      "bundleIdentifier": "ph.telegra.Telegraph",
                      "developerName": "MediaTok (Ghost Edition)",
                      "subtitle": "Telegram iOS + /stickers 10k AI + Discord Profile + E2E + Audio Guard",
                      "localizedDescription": "MediaTok iOS Ghost Edition: TikTok Feed, Achievements, Scratch Cards, Call Guard, Bottom Bar Studio, /stickers 10k AI Vault, Infinite Profile Playlist & Voice Bio, Last.fm/ListenBrainz + Discord Connections, Chat Streaks, EXIF Stripper, 4K 60fps Video, Liquid Glass.",
                      "version": app_ver,
                      "versionDate": now_iso,
                      "versionDescription": f"Build b{build_num}: Wave 6 — TikTok Feed, Achievements, Scratch Cards, Call Guard, Bottom Bar Studio",
                      "downloadURL": dl_url,
                      "size": size,
                      "versions": [
                          {
                              "version": app_ver,
                              "buildVersion": str(build_num),
                              "date": now_iso,
                              "localizedDescription": f"MediaTok iOS b{build_num} ({tag})",
                              "downloadURL": dl_url,
                              "size": size
                          }
                      ]
                  }
              ]
          }
          with open(out_path, "w", encoding="utf-8") as f:
              json.dump(source, f, ensure_ascii=False, indent=2)
          PY
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes || true
          gh release create "$TAG" \
            "$GITHUB_WORKSPACE/dist/MediaTok.ipa" \
            "$GITHUB_WORKSPACE/dist/apps.json" \
            --repo "${{ github.repository }}" \
            --latest \
            --title "MediaTok iOS ${APP_VERSION} Ghost Edition (${BUILD_NUMBER})" \
            --notes "MediaTok iOS built on Ghostgram (Telegram iOS ${APP_VERSION}): TikTok Feed (#187), Achievements (#168), Scratch Cards (#163), Call Guard (#58), Bottom Bar Studio (#110), Minesweeper, /stickers 10k AI Vault + Wi-Fi Uploader, Discord Infinite Profile Playlist & Voice Bio, Live Music & Connections, Streaks, EXIF Stripper, 4K60, Liquid Glass & E2E. Install via AltStore, SideStore, ESign, Feather, Sideloadly, LiveContainer, or TrollStore."

      - name: Prune Bazel Disk Cache to < 7.5 GB
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import os
          root = os.path.expanduser("~/.cache/bazel-disk-cache")
          limit = int(7.5 * 1024 * 1024 * 1024)
          if not os.path.isdir(root):
              raise SystemExit(0)
          files = []
          total = 0
          for dirpath, _, filenames in os.walk(root):
              for fn in filenames:
                  p = os.path.join(dirpath, fn)
                  try:
                      st = os.stat(p)
                      files.append((st.st_atime, st.st_size, p))
                      total += st.st_size
                  except OSError:
                      pass
          print(f"Bazel disk cache before prune: {total / (1024**3):.2f} GB ({len(files)} files)")
          if total > limit:
              files.sort(key=lambda x: x[0])
              for _, sz, p in files:
                  if total <= limit:
                      break
                  try:
                      os.remove(p)
                      total -= sz
                  except OSError:
                      pass
              print(f"Bazel disk cache after prune: {total / (1024**3):.2f} GB")
          PY

      - name: Save Bazel Disk Cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bazel-disk-cache
          key: ${{ env.BAZEL_CACHE_KEY }}
